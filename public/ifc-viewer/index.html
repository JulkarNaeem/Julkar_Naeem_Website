<!DOCTYPE html>

<style>

  #top { top:14px; left:14px; right:14px; display:flex; align-items:center; gap:14px; padding:8px 14px; flex-wrap:wrap; }
  #brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; letter-spacing:.3px; padding-right:14px; border-right:1px solid var(--line); }

  #msg { margin-left:auto; color:var(--muted); font-size:12px; }

  #rec .fsec:first-child { padding-left:0; }
  #rec .fsec.out { border-right:0; margin-left:auto; padding-right:0; align-items:flex-end; }
  #rec .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #rec .title { color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.8px; font-size:11px; }
  #rec .dim { color:var(--muted); }
  #rec .out .row button { padding:8px 14px; }

  #parts .tab:hover { color:var(--accent); }

</div><script type="module">
import * as THREE from "three";
import * as WebIFC from "web-ifc";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import * as BufferGeometryUtils from "three/addons/utils/BufferGeometryUtils.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

const msg = document.getElementById("msg");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio * 1.5, 2.5));   // supersampling for sharp edges
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping; renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false;
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.1; }
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.castShadow = true;
sun.shadow.mapSize.set(8192, 8192); sun.shadow.normalBias = 0.02;
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xffffff, 0.8);
fill.position.set(-50, 30, -50);
scene.add(fill);
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setSize(innerWidth, innerHeight);

// ---- Own simple camera controls (Tekla style) ----
// wheel = zoom, Ctrl + middle button = rotate, middle button (or Shift + middle) = pan
// left button drag = rotate too (for trackpads); touch: 1 finger rotate, 2 fingers pan/zoom
const target = new THREE.Vector3();
let theta = -Math.PI/4, phi = Math.PI/3, radius = 50;   // phi: 0 = looking straight down
let g = { theta:null, phi:null, radius:null, tx:0, ty:0, tz:0 };
function applyCamera() {
  phi = Math.min(Math.max(phi, 0.001), Math.PI - 0.001);
  radius = Math.max(radius, modelSize*0.002);
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
function updateCamera() { goal.theta = theta; goal.phi = phi; goal.radius = radius; goal.t.copy(target); }
function rotate(dx, dy) { goal.theta -= dx*0.006; goal.phi -= dy*0.006; goal.phi = Math.min(Math.max(goal.phi, 0.001), Math.PI-0.001); }
function pan(dx, dy) {
  const k = goal.radius * 2*Math.tan(camera.fov*Math.PI/360) / innerHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  goal.t.addScaledVector(right, -dx*k).addScaledVector(up, dy*k);
}
function zoom(f) {
  // zoom toward the point under the cursor; move the target so zooming never gets stuck at a minimum distance
  const nr = goal.radius * f;
  if (f < 1 && nr < modelSize*0.002) { return; }
  const ndc = new THREE.Vector2((lastX/innerWidth)*2-1, -(lastY/innerHeight)*2+1);
  const dir = new THREE.Vector3(ndc.x, ndc.y, 0.5).unproject(camera).sub(camera.position).normalize();
  const delta = goal.radius - nr;
  goal.t.addScaledVector(dir, delta*0.6 * (f < 1 ? 1 : 1));
  goal.radius = nr;
}
const modelCenter = new THREE.Vector3(); let lastX = innerWidth/2, lastY = innerHeight/2, modelSize = 50;
addEventListener("pointermove", e => { lastX = e.clientX; lastY = e.clientY; });

const el = renderer.domElement;
el.addEventListener("contextmenu", e => e.preventDefault());
el.addEventListener("mousedown", e => { if (e.button === 1) e.preventDefault(); });
el.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.12 : 1/1.12); }, { passive:false });
const pts = new Map(); let last = null;
el.addEventListener("pointerdown", e => {
  el.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, e); last = e;
});
el.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY;
  if (pts.size === 1) {
    if (e.pointerType === "mouse") {
      if (e.buttons & 4) { (e.ctrlKey ? rotate : pan)(dx, dy); }   // middle button
      else if (e.buttons & 1) rotate(dx, dy);                       // left button
      else if (e.buttons & 2) pan(dx, dy);                          // right button
    } else rotate(dx, dy);
  } else if (pts.size === 2) {
    const other = [...pts.values()].find(p => p.pointerId !== e.pointerId);
    const d0 = Math.hypot(prev.clientX-other.clientX, prev.clientY-other.clientY);
    const d1 = Math.hypot(e.clientX-other.clientX, e.clientY-other.clientY);
    if (d1 > 0) zoom(d0/d1);
    pan(dx/2, dy/2);
  }
  pts.set(e.pointerId, e);
});
const end = e => pts.delete(e.pointerId);
el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);

document.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => {
  const v = b.dataset.v;
  if (v === "iso")   { theta = -Math.PI/4; phi = Math.PI/3; }
  if (v === "top")   { theta = 0; phi = 0.001; }
  if (v === "front") { theta = -Math.PI/2; phi = Math.PI/2; }
  if (v === "side")  { theta = 0; phi = Math.PI/2; }
  updateCamera();
});

const goal = { theta, phi, radius, t: target.clone() };
(function loop(){
  requestAnimationFrame(loop);
  const a = 0.35;   // smoothing (higher = less floaty)
  let dTheta = goal.theta - theta;
  theta += dTheta*a; phi += (goal.phi-phi)*a; radius += (goal.radius-radius)*a; target.lerp(goal.t, a);
  if (Math.abs(goal.theta-theta)<1e-4 && Math.abs(goal.phi-phi)<1e-4 && Math.abs(goal.radius-radius)<1e-3*radius) { theta=goal.theta; phi=goal.phi; radius=goal.radius; target.copy(goal.t); }
  applyCamera();
  renderer.render(scene, camera);
  if (window.__comp) window.__comp();
})();
updateCamera();

// ---- IFC loading ----
const ifc = new WebIFC.IfcAPI();
ifc.SetWasmPath("https://unpkg.com/web-ifc@0.0.57/");
await ifc.Init();

let model = null;
// remember last file in the browser (IndexedDB) so refresh keeps it
const DB = () => new Promise((res, rej) => { const r = indexedDB.open("ifcviewer", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function saveFile(name, buf) { const db = await DB(); db.transaction("f","readwrite").objectStore("f").put({ name, buf }, "last"); }
async function loadSaved() { const db = await DB(); return new Promise(res => { const q = db.transaction("f").objectStore("f").get("last"); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  const buf = await f.arrayBuffer();
  try { await saveFile(f.name, buf); } catch (err) {}
  showModel(f.name, buf);
});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
loadSaved().then(s => { if (s) showModel(s.name, s.buf); });
async function showModel(name, buf) {
  msg.textContent = "Loading..."; clearSel(); closeProps(); await new Promise(r => setTimeout(r, 40));
  if (model) scene.remove(model);
  elems = []; byName.clear(); edgeGroup.clear(); edgeToken++; const geoCache = new Map();
  model = new THREE.Group();
  lastBuf = buf; const id = ifc.OpenModel(new Uint8Array(buf));
  ifc.StreamAllMeshes(id, mesh => {
    const list = mesh.geometries;
    const et = ifc.GetLineType(id, mesh.expressID); let nm = "?"; let desc = ""; try { const ln = ifc.GetLine(id, mesh.expressID); nm = ln.Name.value || "?"; desc = (ln.Description && ln.Description.value) || ""; } catch (e) {} let vol = 0; const eb = new THREE.Box3();
    for (let i = 0; i < list.size(); i++) {
      const pg = list.get(i);
      const gid = pg.geometryExpressID;
      let cg = geoCache.get(gid);
      if (!cg) {
        const g = ifc.GetGeometry(id, gid);
        const v = ifc.GetVertexArray(g.GetVertexData(), g.GetVertexDataSize());
        const idx = ifc.GetIndexArray(g.GetIndexData(), g.GetIndexDataSize());
        const lv = meshVolLocal(v, idx);
        let bg0 = new THREE.BufferGeometry();
        const buf0 = new THREE.InterleavedBuffer(v, 6);
        bg0.setAttribute("position", new THREE.InterleavedBufferAttribute(buf0, 3, 0));
        bg0.setIndex(new THREE.BufferAttribute(idx, 1));
        // weld shared vertices and smooth normals only across gentle angles (pipes round, plates sharp)
        bg0 = BufferGeometryUtils.mergeVertices(bg0, 1e-4);
        bg0.deleteAttribute("normal");
        bg0 = toCreasedNormals(bg0, Math.PI/6);
        bg0.computeBoundingBox();
        g.delete();
        cg = { bg: bg0, lv }; geoCache.set(gid, cg);
      }
      const bg = cg.bg;
      vol += Math.abs(cg.lv) * Math.abs(new THREE.Matrix4().fromArray(pg.flatTransformation).determinant());
      const c = pg.color;
      const mat = new THREE.MeshStandardMaterial({ roughness:0.6, metalness:0.0, envMapIntensity:0.25,
        color: new THREE.Color(c.x, c.y, c.z), side: THREE.DoubleSide,
        transparent: c.w < 1, opacity: c.w });
      const m = new THREE.Mesh(bg, mat); m.userData.eid = mesh.expressID; m.userData.orig = new THREE.Color(c.x, c.y, c.z);
      m.castShadow = true; m.receiveShadow = true;
      if (false) {
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bg, 30), new THREE.LineBasicMaterial({ color:0x222222, transparent:true, opacity:0.10 }));
        m.add(edges);
      }
      m.applyMatrix4(new THREE.Matrix4().fromArray(pg.flatTransformation));
      model.add(m);
      (byName.get(nm) || byName.set(nm, []).get(nm)).push(m);
      m.geometry.computeBoundingBox(); eb.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrix));
    }
    if (!eb.isEmpty()) elems.push({ type: et, box: eb, id: mesh.expressID, name: nm, desc, vol });
  });

  // no rotation: this model is already Y-up when loaded
  scene.add(model);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()).length();
  box.getCenter(target);
  modelSize = size; modelCenter.copy(target); radius = size*1.0; theta = -Math.PI/4; phi = Math.PI/3;
  sun.position.copy(target).add(new THREE.Vector3(size*0.6, size*1.0, size*0.5)); sun.target.position.copy(target);
  if (window.ground) scene.remove(window.ground);
  window.ground = new THREE.Mesh(new THREE.PlaneGeometry(size*6, size*6), new THREE.MeshStandardMaterial({ color:0xaeaa9f, roughness:1.0, metalness:0 }));
  window.ground.rotation.x = -Math.PI/2; window.ground.position.set(target.x, box.min.y - 0.01, target.z); window.ground.receiveShadow = true; scene.add(window.ground);
  scene.fog = new THREE.Fog(0xaeaa9f, size*1.8, size*4.5);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -size*1.2; sc.right = sc.top = size*1.2; sc.near = 0; sc.far = size*3; sc.updateProjectionMatrix();
  camera.near = size/1000; camera.far = size*50; camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true;
  updateCamera();
  msg.textContent = name + " | wheel = zoom, Ctrl + middle button = rotate, middle button = pan";
  buildParts(); decorateParts(); applySurfaces(); applySteelLook(); applyPalette(); setBg($("bg").value); hideWelds();
  setTimeout(() => { analyze(); $("connInfo").textContent += window.surfTxt || ""; }, 60);
  if ($("edges").checked) setTimeout(addEdges, 120);
}

// ---- Walkthrough: keyframes, orbit, recording ----
const keys = [];
let anim = null, recorder = null, chunks = [];
const $ = id => document.getElementById(id);
const ease = x => x*x*(3-2*x);
$("kAdd").onclick = () => { keys.push({ theta:goal.theta, phi:goal.phi, radius:goal.radius, t:goal.t.clone() }); $("kCount").textContent = keys.length + " points"; };
$("kClear").onclick = () => { keys.length = 0; $("kCount").textContent = "0 points"; };
function catmull(a, b, c, d, u) { return 0.5*((2*b) + (-a+c)*u + (2*a-5*b+4*c-d)*u*u + (-a+3*b-3*c+d)*u*u*u); }
function pathState(s) {   // s in 0..1
  const n = keys.length, f = s*(n-1), i = Math.min(Math.floor(f), n-2), u = f - i;
  const k = j => keys[Math.max(0, Math.min(n-1, j))];
  const c = (p) => catmull(k(i-1)[p], k(i)[p], k(i+1)[p], k(i+2)[p], u);
  return { theta:c("theta"), phi:c("phi"), radius:c("radius"),
    t:new THREE.Vector3(c2("x"), c2("y"), c2("z")) };
  function c2(ax) { return catmull(k(i-1).t[ax], k(i).t[ax], k(i+1).t[ax], k(i+2).t[ax], u); }
}
function play(mode, record) {
  if (mode === "path" && keys.length < 2) { alert("Add at least 2 points first (move the camera, click Add point)."); return; }

    s += (ax*(by*cz-bz*cy) - ay*(bx*cz-bz*cx) + az*(bx*cy-by*cx)) / 6;
  }

}
function meshVolume(v, idx, ft) {
  let s = 0;
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i]*6, b = idx[i+1]*6, c = idx[i+2]*6;
    const ax=v[a], ay=v[a+1], az=v[a+2], bx=v[b], by=v[b+1], bz=v[b+2], cx=v[c], cy=v[c+1], cz=v[c+2];
    s += (ax*(by*cz-bz*cy) - ay*(bx*cz-bz*cx) + az*(bx*cy-by*cx)) / 6;
  }
  const m = new THREE.Matrix4().fromArray(ft);
  return Math.abs(s) * Math.abs(m.determinant());
}
$("report").onclick = async () => {
  if (!elems.length || !lastBuf) { alert("Load an IFC first."); return; }
  msg.textContent = "Building report...";

  const id = ifc.OpenModel(new Uint8Array(lastBuf));
  const rows = [];

    if (e.type === T.IFCMECHANICALFASTENER) continue;           // bolt assemblies listed separately below
    let len = null, wt = null, wsrc = "";

      const sets = await ifc.properties.getPropertySets(id, e.id, true);
      for (const s of sets || []) for (const p of (s.HasProperties || [])) {
        const n = p.Name && p.Name.value, val = p.NominalValue && p.NominalValue.value;
        if (n === "Length" && len == null && typeof val === "number") len = val;
        if (n === "Weight" && wt == null && typeof val === "number") { wt = val; wsrc = "IFC"; }
      }
    } catch (err) {}
    const sz = e.box.getSize(new THREE.Vector3());
    if (len == null || len === 0) len = Math.max(sz.x, sz.y, sz.z);
    if (wt == null || wt === 0) { wt = e.vol * 1e-9 * 7850; wsrc = "Calculated"; }
    rows.push({ "Part name": e.name, "Profile": e.desc, "Length (mm)": +len.toFixed(1), "Weight (kg)": +wt.toFixed(2), "Weight source": wsrc });
  }
  const bolts = elems.filter(e => e.type === T.IFCMECHANICALFASTENER).length;
  ifc.CloseModel(id);
  const groups = new Map();
  rows.forEach(r => { const k = r["Part name"] + "|" + r["Profile"]; const g = groups.get(k) || { "Part name": r["Part name"], "Profile": r["Profile"], "Qty": 0, "Total length (mm)": 0, "Total weight (kg)": 0 };
    g["Qty"]++; g["Total length (mm)"] += r["Length (mm)"]; g["Total weight (kg)"] += r["Weight (kg)"]; groups.set(k, g); });
  const summary = [...groups.values()].map(g => ({ ...g, "Total length (mm)": +g["Total length (mm)"].toFixed(1), "Total weight (kg)": +g["Total weight (kg)"].toFixed(2) }))
    .sort((a,b) => b["Total weight (kg)"] - a["Total weight (kg)"]);
  summary.push({ "Part name": "TOTAL (excluding " + bolts + " bolt assemblies)", "Qty": rows.length, "Total weight (kg)": +rows.reduce((s,r) => s + r["Weight (kg)"], 0).toFixed(2) });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "Summary");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "All parts");

// ---- Click a part: highlight it and show its properties in the side panel ----
let propId = null, selEid = null, selMeshes = [];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c]));
const fmt = (n, d = 1) => Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
function clearSel() {
  selMeshes.forEach(m => { if (m.material && m.material.emissive) { m.material.emissive.setHex(0x000000); m.material.emissiveIntensity = 1; } });
  selMeshes = []; selEid = null;
}
function closeProps() {
  if (propId != null) { try { ifc.CloseModel(propId); } catch (e) {} propId = null; }
  $("props").style.display = "none";
}
function pickAt(cx, cy) {
  if (!model) return null;
  const r = el.getBoundingClientRect();
  const ndc = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(ndc, camera);
  const hits = rc.intersectObjects(model.children.filter(m => m.visible), false);
  return hits.length ? hits[0].object : null;
}
async function selectPart(m) {
  clearSel();
  const eid = m.userData.eid; selEid = eid;
  model.children.forEach(o => { if (o.userData.eid === eid) selMeshes.push(o); });
  selMeshes.forEach(o => { o.material.emissive.setHex(0xf0a23b); o.material.emissiveIntensity = 0.55; });
  const e = elems.find(x => x.id === eid); if (!e) return;
  const panel = $("props"); panel.style.display = "block";
  panel.innerHTML = '<div class="hint">Loading properties...</div>';
  if (propId == null && lastBuf) propId = ifc.OpenModel(new Uint8Array(lastBuf));
  let line = {}, typeName = "", psets = [];
  try { line = ifc.GetLine(propId, eid) || {}; } catch (er) {}
  try { typeName = ifc.GetNameFromTypeCode(e.type) || ""; } catch (er) {}
  try { psets = await ifc.properties.getPropertySets(propId, eid, true) || []; } catch (er) {}
  if (selEid !== eid) return;
  let len = null, wt = null, wsrc = "";
  const groups = [];
  for (const s of psets) {
    const rows = [];
    for (const p of (s.HasProperties || [])) {
      const n = p.Name && p.Name.value; const v = p.NominalValue ? p.NominalValue.value : null;
      if (n == null || v == null) continue;
      if (n === "Length" && len == null && typeof v === "number") len = v;
      if (n === "Weight" && wt == null && typeof v === "number") { wt = v; wsrc = "IFC"; }
      rows.push([n, typeof v === "number" ? fmt(v, 3) : v]);
    }
    if (rows.length) groups.push([(s.Name && s.Name.value) || "Properties", rows]);
  }
  const sz = e.box.getSize(new THREE.Vector3());
  if (!len) len = Math.max(sz.x, sz.y, sz.z);
  if (!wt) { wt = e.vol * 1e-9 * 7850; wsrc = "calculated"; }
  const same = elems.filter(x => x.name === e.name && x.desc === e.desc).length;
  const val = k => line[k] && line[k].value != null ? line[k].value : "";
  const row = (a, b) => b === "" || b == null ? "" : `<div class="r"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
  let h = `<div class="ph"><div><div class="t">${esc(e.name)}</div><div class="s">${esc(e.desc || typeName)}</div></div><button id="propsClose" title="Close">&times;</button></div>`;
  h += `<div class="big"><div><small>Length</small><b>${fmt(len)} mm</b></div><div><small>Weight${wsrc === "calculated" ? " (calc.)" : ""}</small><b>${fmt(wt, 2)} kg</b></div></div>`;
  h += `<div class="sec"><h4>General</h4>${row("Name", e.name)}${row("Profile", e.desc)}${row("IFC type", typeName)}${row("Mark / tag", val("Tag"))}${row("Object type", val("ObjectType"))}${row("GUID", val("GlobalId"))}${row("Express ID", "#" + eid)}${row("Same part in model", same + " pcs")}</div>`;
  h += `<div class="sec"><h4>Dimensions</h4>${row("Bounding box", fmt(sz.x,0) + " × " + fmt(sz.y,0) + " × " + fmt(sz.z,0) + " mm")}${row("Volume", fmt(e.vol / 1e6, 1) + " cm³")}${row("Weight source", wsrc)}</div>`;
  groups.forEach(([n, rows]) => { h += `<div class="sec"><h4>${esc(n)}</h4>${rows.map(r => row(r[0], r[1])).join("")}</div>`; });
  panel.innerHTML = h;
  $("propsClose").onclick = () => { clearSel(); panel.style.display = "none"; };
}
let downAt = null;
el.addEventListener("pointerdown", e => { downAt = e.button === 0 ? { x: e.clientX, y: e.clientY } : null; });
el.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) { downAt = null; return; }
  downAt = null;
  const m = pickAt(e.clientX, e.clientY);
  if (m) selectPart(m); else { clearSel(); $("props").style.display = "none"; }
});
window.addEventListener("keydown", e => { if (e.key === "Escape") { clearSel(); $("props").style.display = "none"; } });
// ---- Color palettes for social media (by part role) ----
const PALETTES = {
  premium: { purlin:0xf1f5f9, girt:0x5eead4, brace:0xf0605a, main:0x4a90e2, plate:0xf7c948, stiff:0x9cc8f5, other:0xcbd5e1, bolt:0xf59e42 },
  gold:    { purlin:0x8da2b8, girt:0x4fb6c4, brace:0xe5645b, main:0xe2e8f0, plate:0xe8c15a, stiff:0x9fb3c8, other:0xb6c2d0, bolt:0xf08a4b },
  vivid:   { purlin:0xffffff, girt:0x22d3ee, brace:0xef4444, main:0x3b82f6, plate:0xfacc15, stiff:0xa78bfa, other:0x94a3b8, bolt:0xfb923c },
}; 
function partRole(n) {
  if (/purlin/i.test(n)) return "purlin";
  if (/girt/i.test(n)) return "girt";
  if (/brac|wall\s*(brac|rod|cable|x)|cable|tie\s*rod|flange\s*brace|f\.?\s*brace|fb\b|sag\s*rod|rod\s*brace|x-?brace/i.test(n)) return "brace";
  if (/bolt|nut|washer|anchor|screw/i.test(n)) return "bolt";
  if (/stiff/i.test(n)) return "stiff";
  if (/plate|cleat|gusset|angle|bracket|doubler|shim|lug|pl\b/i.test(n)) return "plate";
  if (/flange|web|beam|column|rafter|purlin|girt|brace|chord|truss|tube|pipe|hss|channel|^i$|^h$/i.test(n)) return "main";
  return "other";
}
function applyPalette() {
  const sel = $("pal").value, pal = PALETTES[sel];
  for (const [name, list] of byName) {
    const role = partRole(name);
    for (const m of list) {
      if (!m.material || m.material.map) continue;
      if (!pal) m.material.color.copy(m.userData.orig);
      else m.material.color.setHex(pal[role]);
      m.material.needsUpdate = true;
    }
  }
}
$("pal").onchange = applyPalette;
// ---- Parts panel: slide open/closed, lock, and filter ----
let partsLocked = true, partsTimer = null;
function decorateParts() {
  const box = $("parts");
  const labels = [...box.querySelectorAll("label")];
  box.innerHTML = "";
  const head = document.createElement("div"); head.className = "ph2";
  head.innerHTML = '<b>Parts</b><button id="pAll" title="Show all">All</button><button id="pNone" title="Hide all">None</button><button id="pLock" class="on" title="Locked: panel stays open. Unlock: it slides away when you move off it.">&#128274;</button><button id="pHide" title="Hide panel">&#10094;</button>';
  const fl = document.createElement("input"); fl.className = "fl"; fl.placeholder = "Filter parts...";
  const list = document.createElement("div"); list.className = "plist"; labels.forEach(l => list.append(l));
  const tab = document.createElement("div"); tab.className = "tab"; tab.textContent = "Parts"; tab.onclick = () => box.classList.remove("closed");
  box.append(head, fl, list, tab);
  fl.oninput = () => { const q = fl.value.toLowerCase(); labels.forEach(l => l.style.display = l.textContent.toLowerCase().includes(q) ? "block" : "none"); };
  const setAll = on => labels.forEach(l => { if (l.style.display === "none") return; const c = l.querySelector("input"); if (c.checked !== on) { c.checked = on; c.onchange(); } });
  $("pAll").onclick = () => setAll(true); $("pNone").onclick = () => setAll(false);
  $("pHide").onclick = () => box.classList.add("closed");
  $("pLock").onclick = e => { partsLocked = !partsLocked; e.currentTarget.classList.toggle("on", partsLocked); e.currentTarget.innerHTML = partsLocked ? "&#128274;" : "&#128275;"; };
  box.onmouseleave = () => { if (!partsLocked) partsTimer = setTimeout(() => box.classList.add("closed"), 1200); };
  box.onmouseenter = () => clearTimeout(partsTimer);
  box.classList.add("closed");
}</script>
